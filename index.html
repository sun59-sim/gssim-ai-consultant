<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>심규선 | AI 경영 컨설턴트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864;
    --white: #ffffff;
    --gray: #333333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--gray);
    background: var(--white);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    color: var(--white);
    text-align: center;
    padding: 36px 20px 28px;
  }

  .profile-photo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--white);
    margin-bottom: 18px;
    background: var(--white);
  }

  .name-line {
    font-size: clamp(0.95rem, 4.6vw, 1.5rem);
    font-weight: 700;
    line-height: 1.4;
    white-space: nowrap;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .intro {
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--white);
    opacity: 0.92;
    word-break: keep-all;
  }

  /* ── CAREER ── */
  .career-section {
    flex: 1;
    padding: 28px 20px;
  }

  .section-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }

  .career-card {
    border: 1px solid var(--navy);
    border-left: 4px solid var(--navy);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }

  .career-card p {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--gray);
    line-height: 1.6;
    word-break: keep-all;
  }

  /* ── CONTACT ── */
  .contact-section {
    padding: 0 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 15px;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    border: 2px solid var(--navy);
    cursor: pointer;
    font-family: inherit;
  }

  .btn-email {
    background: var(--navy);
    color: var(--white);
  }

  .btn-phone {
    background: var(--white);
    color: var(--navy);
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: var(--white);
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 14px 20px 24px;
    font-size: 0.75rem;
    color: var(--gray);
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header>
    <img class="profile-photo" id="profileImg" src="./profile.jpg" alt="심규선"
         onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27110%27 height=%27110%27%3E%3Crect width=%27110%27 height=%27110%27 fill=%27%231F3864%27/%3E%3Ctext x=%2755%27 y=%2762%27 font-size=%2740%27 fill=%27%23ffffff%27 text-anchor=%27middle%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E심%3C/text%3E%3C/svg%3E'">
    <div class="name-line">심규선 · AI 경영 컨설턴트 · (주)상상우리</div>
    <p class="intro">
      상장기업 실무 경력과 AI 기술을 결합하여<br>
      소상공인·중소기업의 경영 문제를<br>
      해결해 드립니다
    </p>
  </header>

  <!-- CAREER -->
  <section class="career-section">
    <div class="section-label">CAREER</div>
    <div class="career-card">
      <p>상장기업 37년 CFO, 기획관리 임원</p>
    </div>
    <div class="career-card">
      <p>3개 회사 IPO, 주식상장 성공</p>
    </div>
    <div class="career-card">
      <p>사업계획, 투자분석, 경영진단</p>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="contact-section">
    <a href="mailto:goodsonsim@gmail.com" class="btn btn-email">이메일 보내기</a>
    <button class="btn btn-phone" onclick="copyPhone()">전화 걸기</button>
  </section>

  <footer>
    심규선 · AI 경영 컨설턴트 · (주)상상우리
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
  function copyPhone() {
    const phone = '010-2245-9507';
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(phone)
        .then(() => showToast('전화번호가 복사되었습니다: ' + phone))
        .catch(() => fallbackCopy(phone, showToast));
    } else {
      fallbackCopy(phone, showToast);
    }
  }

  function fallbackCopy(text, cb) {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.select();
    try {
      document.execCommand('copy');
      cb('전화번호가 복사되었습니다: ' + text);
    } catch (e) {
      cb('복사 실패. 직접 입력해주세요: ' + text);
    }
    document.body.removeChild(el);
  }
</script>
</body>
</html>
