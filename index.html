<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>심규선 | AI 경영 컨설턴트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864;
    --navy-deep: #142845;
    --navy-light: #2f4f86;
    --gold: #c9a84c;
    --gold-light: #ecd089;
    --white: #ffffff;
    --gray: #333333;
    --gray-soft: #f4f6fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--gray);
    background: var(--gray-soft);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--white);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(150deg, var(--navy) 0%, var(--navy-deep) 100%);
    color: var(--white);
    text-align: center;
    padding: 46px 24px 38px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; top: -60px; right: -50px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  header::after {
    content: '';
    position: absolute; bottom: -70px; left: -50px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(201,168,76,0.10);
  }

  .photo-ring {
    width: 136px;
    height: 136px;
    border-radius: 50%;
    margin: 0 auto 20px;
    padding: 4px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    position: relative;
    z-index: 1;
  }
  .photo-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--white);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .profile-photo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
  }

  .name-line {
    font-size: clamp(1rem, 4.8vw, 1.55rem);
    font-weight: 900;
    line-height: 1.45;
    white-space: nowrap;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }

  .intro {
    font-size: 0.95rem;
    line-height: 1.85;
    color: rgba(255,255,255,0.85);
    word-break: keep-all;
    position: relative;
    z-index: 1;
  }

  /* ── CAREER ── */
  .career-section {
    flex: 1;
    padding: 36px 22px 8px;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.18em;
    margin-bottom: 18px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--gold), transparent);
  }

  .career-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--white);
    border: 1px solid rgba(31,56,100,0.08);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 3px 14px rgba(31,56,100,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .career-card:active {
    transform: scale(0.99);
  }

  .career-icon {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 3px 8px rgba(31,56,100,0.25);
  }

  .career-card p {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--gray);
    line-height: 1.6;
    word-break: keep-all;
  }

  /* ── CONTACT ── */
  .contact-section {
    padding: 30px 22px 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:active {
    transform: scale(0.97);
  }

  .btn-email {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: var(--white);
    box-shadow: 0 8px 20px rgba(31,56,100,0.28);
  }
  .btn-phone {
    background: var(--white);
    color: var(--navy);
    border: 2px solid var(--navy);
  }
  .btn-icon {
    font-size: 1.2rem;
    line-height: 1;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy);
    color: var(--white);
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 18px 20px 28px;
    font-size: 0.75rem;
    color: var(--gray);
    opacity: 0.55;
    border-top: 1px solid var(--gray-soft);
  }

  /* ── FADE IN ── */
  .fade-in {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header>
    <div class="photo-ring">
      <div class="photo-inner">
        <img class="profile-photo" id="profileImg" src="./profile.jpg" alt="심규선"
             onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27136%27 height=%27136%27%3E%3Crect width=%27136%27 height=%27136%27 fill=%27%231F3864%27/%3E%3Ctext x=%2768%27 y=%2778%27 font-size=%2748%27 fill=%27%23ecd089%27 text-anchor=%27middle%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E심%3C/text%3E%3C/svg%3E'">
      </div>
    </div>
    <div class="name-line">심규선 · AI 경영 컨설턴트 · (주)상상우리</div>
    <p class="intro">
      상장기업 실무 경력과 AI 기술을 결합하여<br>
      소상공인·중소기업의 경영 문제를<br>
      해결해 드립니다
    </p>
  </header>

  <!-- CAREER -->
  <section class="career-section">
    <div class="section-label">CAREER</div>
    <div class="career-card fade-in">
      <div class="career-icon">💼</div>
      <p>상장기업 37년 CFO, 기획관리 임원</p>
    </div>
    <div class="career-card fade-in">
      <div class="career-icon">🏆</div>
      <p>3개 회사 IPO, 주식상장 성공</p>
    </div>
    <div class="career-card fade-in">
      <div class="career-icon">📊</div>
      <p>사업계획, 투자분석, 경영진단</p>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="contact-section">
    <a href="mailto:goodsonsim@gmail.com" class="btn btn-email">
      <span class="btn-icon">📧</span> 이메일 보내기
    </a>
    <button class="btn btn-phone" onclick="copyPhone()">
      <span class="btn-icon">📞</span> 전화 걸기
    </button>
  </section>

  <footer>
    심규선 · AI 경영 컨설턴트 · (주)상상우리
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
  function copyPhone() {
    const phone = '010-2245-9507';
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(phone)
        .then(() => showToast('전화번호가 복사되었습니다: ' + phone))
        .catch(() => fallbackCopy(phone, showToast));
    } else {
      fallbackCopy(phone, showToast);
    }
  }

  function fallbackCopy(text, cb) {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.select();
    try {
      document.execCommand('copy');
      cb('전화번호가 복사되었습니다: ' + text);
    } catch (e) {
      cb('복사 실패. 직접 입력해주세요: ' + text);
    }
    document.body.removeChild(el);
  }

  // fade-in on scroll
  const els = document.querySelectorAll('.fade-in');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  els.forEach(el => obs.observe(el));
</script>
</body>
</html>
